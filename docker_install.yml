---
- name: Установка Docker на целевой сервер
  hosts: targets
  become: yes

  tasks:
    - name: Обновить кэш пакетов
      apt:
        update_cache: yes

    - name: Установить необходимые зависимости
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Добавить официальный GPG-ключ Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Добавить репозиторий Docker
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Установить Docker и Docker Compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Запустить и включить Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Добавить пользователя devops в группу docker
      user:
        name: devops
        groups: docker
        append: yes
